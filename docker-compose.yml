# Docker Compose — EventHub
# Tahap ini baru menyiapkan SERVICE DATABASE (PostgreSQL).
# Service "app" (backend Go) ditambahkan nanti setelah boilerplate siap.

services:
  db:
    image: postgres:16-alpine
    container_name: eventhub-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-eventhub}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-eventhub}
      POSTGRES_DB: ${DB_NAME:-eventhub}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - eventhub_pgdata:/var/lib/postgresql/data
      # Migrasi awal akan dijalankan oleh aplikasi; folder ini opsional untuk seed manual.
      # - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-eventhub} -d ${DB_NAME:-eventhub}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  eventhub_pgdata:
